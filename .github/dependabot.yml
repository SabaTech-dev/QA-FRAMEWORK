# QA-FRAMEWORK Dependabot Configuration
# Auto-generated by Alfred — 2026-06-05
# Keeps Python, npm, Docker, and GitHub Actions dependencies up to date.
# 2026-08-27: added per-ecosystem update groups (playbook AMC #9) so weekly
# updates arrive as ONE PR per ecosystem instead of one PR per package
# (26+ individual PRs accumulated between 2026-06-05 and 2026-08-24).
# 2026-08-27: group-split into majors vs minors-patch per ecosystem so major
# bumps land in isolated PRs. stripe is GATED (Joker): excluded from every
# group in ecosystems where it can appear (pip root, pip backend, npm);
# it keeps receiving individual (ungrouped) PRs as before.
# 2026-08-27: majors groups also exclude high-blast-radius frameworks (card
# f28cecdb) — pip: sqlalchemy, fastapi, starlette, pydantic; npm: next,
# react, vite. Only innocuous majors get bundled; the excluded ones fall
# back to individual PRs for isolated review, same as stripe.

version: 2
updates:
  # Python (QA-FRAMEWORK core)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      pip-root-majors:
        update-types:
          - "major"
        exclude-patterns:
          - "stripe"
          - "sqlalchemy"
          - "fastapi"
          - "starlette"
          - "pydantic"
      pip-root-minors-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "stripe"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "SabaTech-dev"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Python (Dashboard backend)
  - package-ecosystem: "pip"
    directory: "/dashboard/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      pip-backend-majors:
        update-types:
          - "major"
        exclude-patterns:
          - "stripe"
          - "sqlalchemy"
          - "fastapi"
          - "starlette"
          - "pydantic"
      pip-backend-minors-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "stripe"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
      - "dashboard"
    reviewers:
      - "SabaTech-dev"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # npm (Dashboard frontend)
  - package-ecosystem: "npm"
    directory: "/dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      npm-frontend-majors:
        update-types:
          - "major"
        exclude-patterns:
          - "@stripe/*"
          - "next"
          - "react"
          - "vite"
      npm-frontend-minors-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@stripe/*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
      - "dashboard"
    reviewers:
      - "SabaTech-dev"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Docker (Dashboard backend)
  - package-ecosystem: "docker"
    directory: "/dashboard/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      docker-backend-majors:
        update-types:
          - "major"
      docker-backend-minors-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docker"
      - "dashboard"
    reviewers:
      - "SabaTech-dev"

  # Docker (Dashboard frontend)
  - package-ecosystem: "docker"
    directory: "/dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      docker-frontend-majors:
        update-types:
          - "major"
      docker-frontend-minors-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docker"
      - "dashboard"
    reviewers:
      - "SabaTech-dev"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      github-actions-majors:
        update-types:
          - "major"
      github-actions-minors-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "SabaTech-dev"
