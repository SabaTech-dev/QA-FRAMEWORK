# QA-FRAMEWORK Dependabot Configuration
# Auto-generated by Alfred — 2026-06-05
# Keeps Python, npm, Docker, and GitHub Actions dependencies up to date.
# 2026-08-27: added per-ecosystem update groups (playbook AMC #9) so weekly
# updates arrive as ONE PR per ecosystem instead of one PR per package
# (26+ individual PRs accumulated between 2026-06-05 and 2026-08-24).

version: 2
updates:
  # Python (QA-FRAMEWORK core)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      pip-root-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "SabaTech-dev"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Python (Dashboard backend)
  - package-ecosystem: "pip"
    directory: "/dashboard/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      pip-backend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
      - "dashboard"
    reviewers:
      - "SabaTech-dev"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # npm (Dashboard frontend)
  - package-ecosystem: "npm"
    directory: "/dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      npm-frontend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
      - "dashboard"
    reviewers:
      - "SabaTech-dev"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Docker (Dashboard backend)
  - package-ecosystem: "docker"
    directory: "/dashboard/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      docker-backend-images:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "docker"
      - "dashboard"
    reviewers:
      - "SabaTech-dev"

  # Docker (Dashboard frontend)
  - package-ecosystem: "docker"
    directory: "/dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      docker-frontend-images:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "docker"
      - "dashboard"
    reviewers:
      - "SabaTech-dev"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "SabaTech-dev"
