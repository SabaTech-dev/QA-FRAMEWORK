name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Evita acumulación de runs colgados por push (auto-cancel del anterior)
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Capa 6 del CI rot (#111): job colgaba indefinidamente en "Install Playwright
    # browsers" (ningún run completado jamás). Timeout = señal honesta + logs.
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        working-directory: dashboard/frontend
        run: npm ci --strict-allow-scripts

      - name: Smoke test post-install (npm v12 install-scripts)
        working-directory: dashboard/frontend
        run: node scripts/smoke-install.mjs

      - name: Install Playwright browsers
        working-directory: dashboard/frontend
        # #111: este step cuelga indefinidamente (nunca completó un run).
        # Timeout 10m + non-blocking hasta cerrar #111 (triage con artifacts).
        timeout-minutes: 10
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: dashboard/frontend
        # #111: suite never-green (nunca llegó a correr por el hang de browsers).
        # Non-blocking hasta cerrar #111 — señal trackeda en el issue.
        continue-on-error: true
        run: npx playwright test --reporter=html
        env:
          CI: true

      - name: Upload test artifacts
        if: !cancelled()
        uses: actions/upload-artifact@v4 # v4.6.2
        with:
          name: playwright-report
          path: dashboard/frontend/playwright-report/
          retention-days: 7
