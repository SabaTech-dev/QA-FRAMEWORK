# =============================================================================
# OWASP Top 10:2025 Security Compliance Pipeline
# Runs OWASP-specific checks: semgrep, gitleaks, OWASP test suite, SBOM
# =============================================================================

name: OWASP Top 10:2025 Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly OWASP compliance check (Sundays 3 AM UTC)
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: owasp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ===========================================================================
  # Semgrep Static Analysis
  # ===========================================================================
  semgrep:
    name: Semgrep SAST (OWASP Rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pip install semgrep==1.165.0

      - name: Run Semgrep
        # returntocorp/semgrep-action@v1 is deprecated and silently ignores the
        # output/output-format inputs, so the SARIF file was never produced.
        # Plain CLI guarantees the artifact exists for upload-sarif and the gate.
        run: semgrep scan --config .semgrep.yml --sarif --output semgrep-results.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-owasp

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          retention-days: 30

  # ===========================================================================
  # Gitleaks Secret Scanning
  # ===========================================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ===========================================================================
  # OWASP Top 10:2025 Test Suite
  # ===========================================================================
  owasp-tests:
    name: OWASP Compliance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-html
          pip install -r requirements.txt 2>/dev/null || pip install pydantic pydantic-settings || true

      - name: Run OWASP Top 10:2025 compliance tests
        run: |
          pytest tests/security/test_owasp_top10_2025.py \
            -v \
            --tb=short \
            --html=owasp-report.html \
            --self-contained-html \
            -W ignore::pytest.PytestConfigWarning \
            || true
        continue-on-error: true

      - name: Upload OWASP test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: owasp-compliance-report
          path: owasp-report.html
          retention-days: 30

      - name: Summarize OWASP results
        if: always()
        run: |
          echo "## 🛡️ OWASP Top 10:2025 Compliance Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f owasp-report.html ]; then
            echo "✅ OWASP compliance test report generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ OWASP compliance test report not generated" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # SBOM Generation (Syft + CycloneDX)
  # ===========================================================================
  sbom-syft:
    name: SBOM Generation (Syft)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM with Syft
        run: |
          syft . -o cyclonedx-json > sbom-syft-cyclonedx.json
          syft . -o spdx-json > sbom-syft-spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-syft
          path: |
            sbom-syft-cyclonedx.json
            sbom-syft-spdx.json
          retention-days: 90

  # ===========================================================================
  # OWASP Compliance Gate
  # ===========================================================================
  owasp-gate:
    name: OWASP Security Gate
    runs-on: ubuntu-latest
    needs: [semgrep, gitleaks, owasp-tests]
    if: always()
    steps:
      - name: Download Semgrep results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true  # step-level: download-artifact has no such input
        with:
          name: semgrep-results

      - name: Check for critical findings
        run: |
          CRITICAL=0
          if [ -f semgrep-results.sarif ]; then
            # SARIF exposes severity via results[].level ("error"/"warning"/"note");
            # the old grep for '"severity": "error"' could never match.
            C=$(grep -o '"level": "error"' semgrep-results.sarif 2>/dev/null | wc -l)
            CRITICAL=$((CRITICAL + C))
          fi
          
          echo "Total CRITICAL findings: $CRITICAL"
          
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ OWASP gate FAILED: $CRITICAL CRITICAL findings"
            exit 1
          else
            echo "✅ OWASP gate PASSED"
          fi
