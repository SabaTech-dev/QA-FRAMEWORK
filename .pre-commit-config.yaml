# Pre-commit hooks for QA-FRAMEWORK security
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/returntocorp/semgrep
    rev: v1.68.0
    hooks:
      - id: semgrep
        args: ['--config', '.semgrep.yml', '--error']

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        # -ll: gate on medium+ severity. No positional targets here: this
        # hook config is broken otherwise (pre-commit appends the staged
        # files as targets and `-r src -f json` made bandit's argparse
        # reject EVERY .py commit; `src/` does not even exist in this
        # repo). Low findings (B101 asserts in tests, 'bearer'/'refresh'
        # literals) stay out of the gate.
        args: ['-ll']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
