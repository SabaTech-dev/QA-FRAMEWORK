# qa-framework frontend estático — card 75fd5fa6 (F-7, pre-beta)
# Sirve el build de producción (vite build → dist/). El dev server de vite
# (HMR/WS) queda SOLO para desarrollo local — nunca expuesto en prod.
# Rollback: git checkout docker-compose.unified.yml && docker compose -f docker-compose.unified.yml up -d frontend

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de texto para assets ya-minificados
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets hash-eados por vite → cache inmutable 1 año (F-7: capa cacheable edge)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML: siempre revalidar (los hashes de /assets/ son el mecanismo de invalidación)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: rutas del react-router devuelven index.html
    location / {
        try_files $uri /index.html;
    }
}
