global:
  resolve_timeout: 5m

route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
      continue: true

    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: 'default-receiver'
    telegram_configs:
      - bot_token_file: /run/secrets/alertmanager_telegram_token
        api_url: 'https://api.telegram.org'
        chat_id: 346997361
        parse_mode: 'HTML'
        message: |
          🚨 <b>QA-FRAMEWORK ALERT</b>

          {{ range .Alerts }}
          <b>Alert:</b> {{ .Annotations.summary }}
          <b>Description:</b> {{ .Annotations.description }}
          <b>Severity:</b> {{ .Labels.severity }}
          <b>Instance:</b> {{ .Labels.instance }}
          <b>Started:</b> {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  - name: 'critical-alerts'
    telegram_configs:
      - bot_token_file: /run/secrets/alertmanager_telegram_token
        api_url: 'https://api.telegram.org'
        chat_id: 346997361
        parse_mode: 'HTML'
        message: |
          🔴 <b>CRITICAL - QA-FRAMEWORK</b>

          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b>
          {{ .Annotations.description }}
          <b>Instance:</b> {{ .Labels.instance }}
          <b>Started:</b> {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  - name: 'warning-alerts'
    telegram_configs:
      - bot_token_file: /run/secrets/alertmanager_telegram_token
        api_url: 'https://api.telegram.org'
        chat_id: 346997361
        parse_mode: 'HTML'
        message: |
          ⚠️ <b>WARNING - QA-FRAMEWORK</b>

          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b>
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
