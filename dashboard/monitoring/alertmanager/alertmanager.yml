global:
  resolve_timeout: 5m

route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
      continue: true
    
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:3000/api/alerts/webhook'
        send_resolved: true
    slack_configs:
      - api_url: 'http://localhost:3000'
        channel: '#alerts'
        title: 'QA-Framework Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:3000/api/alerts/webhook'
        send_resolved: true
    slack_configs:
      - api_url: 'http://localhost:3000'
        channel: '#critical-alerts'
        title: '🚨 CRITICAL: QA-Framework Alert'
        text: |
          {{ range .Alerts }}
          *CRITICAL ALERT:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://localhost:3000/api/alerts/webhook'
        send_resolved: true
    slack_configs:
      - api_url: 'http://localhost:3000'
        channel: '#warnings'
        title: '⚠️ Warning: QA-Framework'
        text: |
          {{ range .Alerts }}
          *Warning:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
