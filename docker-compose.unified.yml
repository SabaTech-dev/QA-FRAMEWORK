version: '3.8'

services:
  # ==================== DASHBOARD SERVICES ====================
  
  # Backend API
  backend:
    build:
      context: ./dashboard/backend
      dockerfile: Dockerfile
    container_name: qa-framework-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qa_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-qa_dashboard}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY required}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-logs:/app/logs
    networks:
      - qa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: qa-framework-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./dashboard/frontend:/app
      - /app/node_modules
    networks:
      - qa-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: qa-framework-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qa_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-qa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - qa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qa_user} -d ${POSTGRES_DB:-qa_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: qa-framework-cache
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - qa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==================== VULNERABILITY SCANNER SERVICES ====================

  # Nuclei Scanner - Template-based vulnerability scanner
  nuclei-scanner:
    image: projectdiscovery/nuclei:latest
    container_name: qa-framework-nuclei
    profiles:
      - scanners
      - full
    volumes:
      - nuclei-templates:/root/nuclei-templates
      - ./templates/vuln/custom:/custom-templates
      - ./reports/vuln:/output
    networks:
      - qa-network
    command: ["--help"]
    restart: "no"

  # WSTG Scanner - OWASP Web Security Testing Guide
  wstg-scanner:
    build:
      context: ./docker/vuln
      dockerfile: Dockerfile.wstg
    container_name: qa-framework-wstg
    profiles:
      - scanners
      - full
    volumes:
      - ./reports/vuln:/output
    networks:
      - qa-network
    command: ["--help"]
    restart: "no"

  # ==================== MONITORING SERVICES ====================
  
  # Prometheus
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: qa-framework-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./dashboard/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - qa-network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:10.0.0
    container_name: qa-framework-grafana
    env_file: .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER required}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./dashboard/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - qa-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: qa-framework-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./dashboard/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - qa-network
    restart: unless-stopped

# Named volumes
volumes:
  postgres-data:
  redis-data:
  backend-logs:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  nuclei-templates:

# Networks
networks:
  qa-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
