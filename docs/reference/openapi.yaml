        \    POST /api/v1/executions/1/stop\n    Authorization: Bearer <token>\n\n\
        \    Response:\n    {\n        \"message\": \"Execution stopped successfully\"\
        ,\n        \"execution_id\": 1,\n        \"status\": \"failed\",\n       \
