        \    {\n        \"username\": \"john_doe\",\n        \"email\": \"john.doe@example.com\"\
        ,\n        \"password\": \"SecurePass123!\",\n        \"is_active\": true\n\
        \    }\n\n    Response (201 Created):\n    {\n        \"id\": 2,\n       \
        \ \"username\": \"john_doe\",\n        \"email\": \"john.doe@example.com\"\
        ,\n        \"is_active\": true,\n        \"is_superuser\": false,\n      \
        \  \"created_at\": \"2024-01-15T10:50:00.123456Z\",\n        \"updated_at\"\
        : \"2024-01-15T10:50:00.123456Z\"\n    }"
