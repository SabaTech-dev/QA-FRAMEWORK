        \ completed\n\nExample:\n    POST /api/v1/executions/1/start\n    Authorization:\
        \ Bearer <token>\n\n    Response:\n    {\n        \"message\": \"Execution\
        \ started successfully\",\n        \"execution_id\": 1,\n        \"status\"\
        : \"running\",\n        \"started_at\": \"2024-01-15T10:40:00.123456Z\"\n\
        \    }"
