[tool.poetry]
name = "qa-framework"
version = "1.0.0"
description = "Modern QA Automation Framework with Clean Architecture"
authors = ["Jose Manuel Sabarís García <jmsabaris@sabatech.dev>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pytest = "9.0.3"
pytest-asyncio = "1.4.0"
pytest-xdist = "3.8.0"
pytest-cov = "7.1.0"
allure-pytest = "2.13.5"
pytest-html = "4.2.0"
httpx = "0.26.0"
requests = "2.34.2"
playwright = "^1.62"
selenium = "4.16.0"
faker = "23.2.0"
factory-boy = "3.3.0"
pydantic = "2.6.1"
pydantic-settings = "2.1.0"
pyyaml = "6.0.1"
python-dotenv = "1.2.2"
pydantic-extra-types = "2.11.1"
locust = "^2.31"
bandit = "1.7.6"
safety = ">=3.0.0"
sqlalchemy = "^2.0"
asyncpg = "0.29.0"
aiomysql = "0.3.2"
aiosqlite = "0.19.0"
fastapi = "0.115.4"
python-jose = {version = ">=3.4.0,<4", extras = ["cryptography"]}
bcrypt = "5.0.0"
pyjwt = ">=2.8.0,<3"
python-multipart = ">=0.0.27"
redis = "5.0.1"
psutil = "5.9.8"

[tool.poetry.group.dev.dependencies]
black = "26.5.1"
ruff = "0.16.4"
mypy = "1.8.0"
pre-commit = "3.6.0"
isort = "5.13.2"
types-PyYAML = "6.0.12.20260815"
types-requests = "2.31.0.20240106"
types-urllib3 = "1.26.25.14"
mkdocs = "^1.5.0"
mkdocs-material = "^9.5.0"
mkdocstrings = {extras = ["python"], version = ">=0.24,<1.1"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ruff 0.16.4 expanded-defaults migration (PR ruff-B, Batch C):
# 2,017 mechanical fixes applied; 279 remaining violations are judgment-rule
# findings deferred EXPLICITLY (per-rule, counts at migration time). Removing a
# rule from this ignore list = accepting its fixes; do it rule-by-rule.
# F-class: 0 real errors (4 trivial F401 fixed in this PR).
ignore = [
    "BLE001",  # 77: blind-except — deliberate around third-party calls (logging+fallback paths)
    "DTZ001", "DTZ003", "DTZ004", "DTZ005",  # 61: tz-naive datetimes — needs API-wide tz decision, not mechanical
    "RUF012",  # 25: mutable class defaults — needs ClassVar annotations w/ semantic review
    "PYI036", "PYI034",  # 27: exit/annotation stub conventions
    "SIM102", "SIM103", "SIM117",  # 19: collapsible-if style churn
    "S110",   # 8: try-except-pass — audit-worthy, separate card
    "RUF059", "RUF013", "RUF022", "RUF034", "RUF007",  # 26: ruff opinion rules
    "B008", "B004", "B017",  # 8: bugbear opinions (B008 FastAPI Depends pattern)
    "PLW1510", "PLW0602",  # 7: global/subprocess check opinions
    "PIE810", "C408", "C414",  # 8: call style
    "ASYNC221", "ASYNC230",  # 7: async timeout/blocking calls — needs real refactor
    "UP035",  # 2: typing.List legacy re-exports (external compat)
    "TRY002", # 1: raise-vanilla-class
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "performance: Performance tests",
    "security: Security tests",
]

[tool.isort]
profile = "black"
line_length = 100
